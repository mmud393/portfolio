<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">Carbon Confession footprint dashboard mockup</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset="1" stop-color="#08111F" />
    </linearGradient>
    <radialGradient id="glowEm" cx="0.3" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowLime" cx="0.8" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.14" />
      <stop offset="1" stop-color="#22C55E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="phoneScreen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#050A16" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)" />
  <rect width="1600" height="900" fill="url(#glowEm)" />
  <rect width="1600" height="900" fill="url(#glowLime)" />

  <!-- dashboard card -->
  <rect x="120" y="150" width="620" height="480" rx="24" fill="#0B1220" stroke="#1E293B" stroke-width="2" />
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Carbon Score</text>
  <circle cx="430" cy="360" r="140" fill="none" stroke="#111C33" stroke-width="24" />
  <circle cx="430" cy="360" r="140" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round"
    stroke-dasharray="660" stroke-dashoffset="180" transform="rotate(-90 430 360)" />
  <text x="430" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC">72</text>
  <text x="430" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748B">score / 100</text>
  <rect x="180" y="540" width="500" height="20" rx="10" fill="#111C33" />
  <rect x="180" y="540" width="330" height="20" rx="10" fill="#10B981" />

  <!-- phone mockup -->
  <rect x="800" y="120" width="280" height="560" rx="36" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <rect x="818" y="160" width="244" height="480" rx="18" fill="url(#phoneScreen2)" />
  <rect x="838" y="190" width="204" height="70" rx="12" fill="#111C33" />
  <rect x="856" y="210" width="120" height="10" rx="4" fill="#334155" />
  <rect x="856" y="230" width="80" height="8" rx="4" fill="#1E293B" />
  <rect x="838" y="276" width="204" height="150" rx="12" fill="#111C33" />
  <circle cx="940" cy="350" r="50" fill="none" stroke="#22C55E" stroke-width="10" stroke-dasharray="230" stroke-dashoffset="60" transform="rotate(-90 940 350)" />
  <rect x="838" y="442" width="98" height="60" rx="10" fill="#111C33" />
  <rect x="944" y="442" width="98" height="60" rx="10" fill="#111C33" />
  <rect x="838" y="516" width="204" height="44" rx="22" fill="#10B981" opacity="0.9" />

  <!-- badges row -->
  <g>
    <circle cx="1200" cy="300" r="46" fill="#0F172A" stroke="#22C55E" stroke-width="2" />
    <circle cx="1200" cy="300" r="18" fill="#22C55E" opacity="0.85" />
    <circle cx="1320" cy="420" r="46" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <circle cx="1320" cy="420" r="18" fill="#10B981" opacity="0.85" />
    <circle cx="1200" cy="540" r="46" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
    <circle cx="1200" cy="540" r="18" fill="#06B6D4" opacity="0.7" />
  </g>

  <text x="140" y="710" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">Carbon Confession</text>
  <text x="140" y="745" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">Footprint tracking • Offsets • Badges — placeholder mockup</text>
</svg>
