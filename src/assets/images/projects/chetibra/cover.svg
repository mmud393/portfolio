<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">Chetibra cycling community app mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset="1" stop-color="#08111F" />
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.8" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.16" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#050A16" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glowGreen)" />
  <rect width="1600" height="900" fill="url(#glowCyan)" />

