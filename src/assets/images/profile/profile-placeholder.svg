<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title">
  <title id="title">Placeholder profile portrait</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F" />
      <stop offset="1" stop-color="#050A16" />
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#bg)" />
  <rect width="480" height="480" fill="url(#glow)" />

  <!-- shoulders / torso -->
  <path d="M110 480 C110 360 175 320 240 320 C305 320 370 360 370 480 Z" fill="url(#person)" />
  <!-- neck -->
  <rect x="215" y="255" width="50" height="60" fill="url(#person)" />
  <!-- head -->
  <ellipse cx="240" cy="200" rx="78" ry="88" fill="url(#person)" />

  <text x="240" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748B">
    Replace with profile.webp
  </text>
</svg>
